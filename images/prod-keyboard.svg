<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="kb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2220"/>
      <stop offset="100%" stop-color="#121513"/>
    </linearGradient>
    <linearGradient id="rgb-strip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d5f36b"/>
      <stop offset="50%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#kb-bg)"/>
  <!-- Ambient glow -->
  <ellipse cx="200" cy="150" rx="140" ry="70" fill="rgba(213,243,107,0.12)"/>
  <!-- Keyboard chassis -->
  <rect x="50" y="75" width="300" height="150" rx="14" fill="#0c0e0d" stroke="#2a302c" stroke-width="3"/>
  <rect x="60" y="85" width="280" height="130" rx="10" fill="#181c1a"/>
  <!-- RGB Underglow Line -->
  <line x1="56" y1="228" x2="344" y2="228" stroke="url(#rgb-strip)" stroke-width="3" stroke-linecap="round"/>

  <!-- Row 1 Keys -->
  <g fill="#252b27" stroke="#333b35" rx="3">
    <rect x="70" y="94" width="18" height="18" rx="3"/>
    <rect x="94" y="94" width="18" height="18" rx="3"/>
    <rect x="118" y="94" width="18" height="18" rx="3"/>
    <rect x="142" y="94" width="18" height="18" rx="3"/>
    <rect x="166" y="94" width="18" height="18" rx="3"/>
    <rect x="190" y="94" width="18" height="18" rx="3"/>
    <rect x="214" y="94" width="18" height="18" rx="3"/>
    <rect x="238" y="94" width="18" height="18" rx="3"/>
    <rect x="262" y="94" width="18" height="18" rx="3"/>
    <rect x="286" y="94" width="18" height="18" rx="3"/>
    <rect x="310" y="94" width="20" height="18" rx="3" fill="#2d3329"/>
  </g>
  <!-- Row 2 Keys -->
  <g fill="#252b27" stroke="#333b35">
    <rect x="70" y="118" width="24" height="18" rx="3"/>
    <rect x="100" y="118" width="18" height="18" rx="3"/>
    <rect x="124" y="118" width="18" height="18" rx="3"/>
    <rect x="148" y="118" width="18" height="18" rx="3"/>
    <rect x="172" y="118" width="18" height="18" rx="3"/>
    <rect x="196" y="118" width="18" height="18" rx="3"/>
    <rect x="220" y="118" width="18" height="18" rx="3"/>
    <rect x="244" y="118" width="18" height="18" rx="3"/>
    <rect x="268" y="118" width="18" height="18" rx="3"/>
    <rect x="292" y="118" width="38" height="18" rx="3" fill="#d5f36b"/>
  </g>
  <!-- Row 3 Keys -->
  <g fill="#252b27" stroke="#333b35">
    <rect x="70" y="142" width="28" height="18" rx="3"/>
    <rect x="104" y="142" width="18" height="18" rx="3"/>
    <rect x="128" y="142" width="18" height="18" rx="3"/>
    <rect x="152" y="142" width="18" height="18" rx="3"/>
    <rect x="176" y="142" width="18" height="18" rx="3"/>
    <rect x="200" y="142" width="18" height="18" rx="3"/>
    <rect x="224" y="142" width="18" height="18" rx="3"/>
    <rect x="248" y="142" width="18" height="18" rx="3"/>
    <rect x="272" y="142" width="18" height="18" rx="3"/>
    <rect x="296" y="142" width="34" height="18" rx="3"/>
  </g>
  <!-- Spacebar row -->
  <g fill="#252b27" stroke="#333b35">
    <rect x="70" y="166" width="32" height="18" rx="3"/>
    <rect x="108" y="166" width="24" height="18" rx="3"/>
    <rect x="138" y="166" width="124" height="18" rx="3" fill="#1f2621" stroke="#d5f36b" stroke-width="1.5"/>
    <rect x="268" y="166" width="28" height="18" rx="3"/>
    <rect x="302" y="166" width="28" height="18" rx="3"/>
  </g>
  <!-- Badge -->
  <text x="200" y="270" fill="#d5f36b" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" letter-spacing="2" text-anchor="middle">ULTRA-LINEAR MECHANICAL KEYBOARD</text>
</svg>
