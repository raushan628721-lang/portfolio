<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="hp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2220"/>
      <stop offset="100%" stop-color="#121513"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5e7eb"/>
      <stop offset="50%" stop-color="#9ca3af"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#hp-bg)"/>
  <ellipse cx="200" cy="150" rx="130" ry="70" fill="rgba(213,243,107,0.12)"/>

  <!-- Headband Arch -->
  <path d="M 120 160 A 90 90 0 0 1 280 160" fill="none" stroke="url(#metal)" stroke-width="10" stroke-linecap="round"/>
  <path d="M 135 140 A 75 75 0 0 1 265 140" fill="none" stroke="#252b27" stroke-width="14" stroke-linecap="round"/>

  <!-- Left Ear Cup -->
  <g transform="translate(100, 160)">
    <rect x="-16" y="-10" width="32" height="60" rx="16" fill="#141715" stroke="#d5f36b" stroke-width="2.5"/>
    <ellipse cx="0" cy="20" rx="11" ry="24" fill="#202522"/>
  </g>

  <!-- Right Ear Cup -->
  <g transform="translate(300, 160)">
    <rect x="-16" y="-10" width="32" height="60" rx="16" fill="#141715" stroke="#d5f36b" stroke-width="2.5"/>
    <ellipse cx="0" cy="20" rx="11" ry="24" fill="#202522"/>
  </g>

  <!-- Sound Waves -->
  <path d="M 60 170 A 30 30 0 0 0 60 190" fill="none" stroke="rgba(213,243,107,0.6)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 50 160 A 45 45 0 0 0 50 200" fill="none" stroke="rgba(213,243,107,0.3)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 340 170 A 30 30 0 0 1 340 190" fill="none" stroke="rgba(213,243,107,0.6)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 350 160 A 45 45 0 0 1 350 200" fill="none" stroke="rgba(213,243,107,0.3)" stroke-width="2" stroke-linecap="round"/>

  <!-- Title -->
  <text x="200" y="270" fill="#d5f36b" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" letter-spacing="2" text-anchor="middle">ACTIVE NOISE-CANCELLING HEADPHONES</text>
</svg>
