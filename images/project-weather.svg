<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="pbg9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c19"/>
      <stop offset="100%" stop-color="#111312"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#pbg9)"/>
  <rect x="20" y="20" width="360" height="160" rx="8" fill="#141815" stroke="rgba(213,243,107,0.2)"/>
  <text x="40" y="46" fill="#d5f36b" font-family="'Space Grotesk'" font-size="12" font-weight="700">WEATHER API (AJAX &amp; JSON)</text>
  <rect x="270" y="32" width="90" height="18" rx="3" fill="rgba(74,222,128,0.15)" stroke="#4ade80"/>
  <text x="315" y="44" fill="#4ade80" font-family="'DM Sans'" font-size="9" font-weight="700" text-anchor="middle">HTTP 200 OK</text>

  <!-- Weather Details -->
  <text x="40" y="78" fill="#fff" font-family="'Space Grotesk'" font-size="16" font-weight="700">Pondicherry, India</text>
  <text x="40" y="94" fill="#d5f36b" font-family="'DM Sans'" font-size="10" font-weight="600">☀️ Sunny &amp; Tropical</text>
  
  <text x="140" y="145" font-size="44">☀️</text>
  <text x="40" y="145" fill="#fff" font-family="'Space Grotesk'" font-size="36" font-weight="700">31°C</text>

  <!-- Mini Metrics -->
  <rect x="220" y="65" width="65" height="42" rx="3" fill="#1b211d"/>
  <text x="226" y="80" fill="#888" font-family="'DM Sans'" font-size="8">HUMIDITY</text>
  <text x="226" y="98" fill="#d5f36b" font-family="'Space Grotesk'" font-size="12" font-weight="700">74%</text>

  <rect x="295" y="65" width="65" height="42" rx="3" fill="#1b211d"/>
  <text x="301" y="80" fill="#888" font-family="'DM Sans'" font-size="8">WIND</text>
  <text x="301" y="98" fill="#d5f36b" font-family="'Space Grotesk'" font-size="12" font-weight="700">14 km/h</text>

  <!-- 5-day strip -->
  <rect x="220" y="115" width="140" height="45" rx="3" fill="#1b211d" stroke="rgba(255,255,255,0.06)"/>
  <text x="230" y="132" font-size="10">Thu ☀️ 31°</text>
  <text x="230" y="148" font-size="10">Fri 🌤️ 32°</text>
  <text x="290" y="132" font-size="10">Sat 🌦️ 30°</text>
  <text x="290" y="148" font-size="10">Sun 🌧️ 29°</text>
</svg>
