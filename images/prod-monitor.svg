<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="mon-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2220"/>
      <stop offset="100%" stop-color="#121513"/>
    </linearGradient>
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#mon-bg)"/>
  <ellipse cx="200" cy="150" rx="140" ry="70" fill="rgba(56,189,248,0.12)"/>

  <!-- Screen Bezel -->
  <rect x="60" y="50" width="280" height="160" rx="8" fill="#0b0e0c" stroke="#252b27" stroke-width="2.5"/>
  <!-- Display Panel -->
  <rect x="66" y="56" width="268" height="148" rx="4" fill="url(#screen-grad)"/>

  <!-- Screen UI Mockup Code / IDE -->
  <circle cx="80" cy="70" r="3" fill="#f87171"/>
  <circle cx="90" cy="70" r="3" fill="#fbbf24"/>
  <circle cx="100" cy="70" r="3" fill="#4ade80"/>
  
  <rect x="80" y="86" width="60" height="6" rx="3" fill="#38bdf8"/>
  <rect x="80" y="98" width="90" height="5" rx="2" fill="#d5f36b"/>
  <rect x="80" y="108" width="120" height="5" rx="2" fill="#94a3b8"/>
  <rect x="80" y="118" width="80" height="5" rx="2" fill="#94a3b8"/>
  <rect x="95" y="128" width="70" height="5" rx="2" fill="#4ade80"/>
  <rect x="80" y="138" width="40" height="5" rx="2" fill="#38bdf8"/>

  <!-- Stand Pole & Base -->
  <rect x="193" y="210" width="14" height="32" fill="#1c211e" stroke="#2a322d"/>
  <ellipse cx="200" cy="242" rx="48" ry="8" fill="#141815" stroke="#d5f36b" stroke-width="1.5"/>

  <!-- Title -->
  <text x="200" y="274" fill="#d5f36b" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" letter-spacing="2" text-anchor="middle">27-INCH 4K UHD DEVELOPER DISPLAY</text>
</svg>
