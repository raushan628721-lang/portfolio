<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="chg-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2220"/>
      <stop offset="100%" stop-color="#121513"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#chg-bg)"/>
  <ellipse cx="200" cy="145" rx="110" ry="60" fill="rgba(213,243,107,0.15)"/>

  <!-- Charger Brick -->
  <rect x="140" y="70" width="120" height="150" rx="16" fill="#141815" stroke="#2c362f" stroke-width="3"/>
  <rect x="148" y="78" width="104" height="134" rx="12" fill="#0c0f0d"/>

  <!-- 100W GaN Badge -->
  <rect x="165" y="94" width="70" height="24" rx="4" fill="#202521" stroke="#d5f36b" stroke-width="1.5"/>
  <text x="200" y="110" fill="#d5f36b" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" text-anchor="middle">100W GaN</text>

  <!-- USB-C Port 1 -->
  <rect x="180" y="132" width="40" height="14" rx="7" fill="#181c19" stroke="#d5f36b" stroke-width="2"/>
  <rect x="188" y="137" width="24" height="4" rx="2" fill="#d5f36b"/>

  <!-- USB-C Port 2 -->
  <rect x="180" y="156" width="40" height="14" rx="7" fill="#181c19" stroke="#d5f36b" stroke-width="2"/>
  <rect x="188" y="161" width="24" height="4" rx="2" fill="#d5f36b"/>

  <!-- Fast Charging Lightning bolt indicator -->
  <path d="M 202 180 L 195 195 L 201 195 L 198 206 L 207 192 L 201 192 Z" fill="#d5f36b"/>

  <!-- Wall Prongs (folding) -->
  <rect x="160" y="48" width="8" height="22" rx="2" fill="#9ca3af"/>
  <rect x="232" y="48" width="8" height="22" rx="2" fill="#9ca3af"/>

  <!-- Title -->
  <text x="200" y="270" fill="#d5f36b" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" letter-spacing="2" text-anchor="middle">100W GaN DUAL USB-C FAST CHARGER</text>
</svg>
